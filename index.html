<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greenbasket – Online Grocery</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#f6f8f3;--card:#fff;--ink:#16261a;--mute:#5d6e61;--line:#dfe6da;--brand:#1f6b3a;--brand-ink:#fff;--sun:#f5c431;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a12;--card:#17251b;--ink:#eaf2e6;--mute:#9fb3a3;--line:#243a2a;--brand:#4fb36d;--brand-ink:#0f1a12}}
:root[data-theme="dark"]{--bg:#0f1a12;--card:#17251b;--ink:#eaf2e6;--mute:#9fb3a3;--line:#243a2a;--brand:#4fb36d;--brand-ink:#0f1a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}
</style>
</head>
<body class="min-h-screen">

<header class="sticky top-0 z-20 border-b" style="background:var(--bg);border-color:var(--line);top:env(safe-area-inset-top,0px)">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
    <div class="text-2xl font-extrabold tracking-tight">Green<span style="color:var(--brand)">basket</span></div>
    <input id="q" type="search" placeholder="Search apples, milk, bread…" class="flex-1 min-w-0 rounded-full px-4 py-2 border outline-none focus:ring-2" style="background:var(--card);border-color:var(--line);--tw-ring-color:var(--brand)">
    <button id="openCart" class="relative rounded-full px-4 py-2 font-semibold" style="background:var(--brand);color:var(--brand-ink)">
      Cart <span id="count" class="ml-1 rounded-full px-2 text-sm font-bold" style="background:var(--sun);color:#16261a">0</span>
    </button>
  </div>
</header>

<section class="max-w-6xl mx-auto px-4 pt-8 pb-4">
  <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight leading-[1.05] max-w-2xl">Fresh groceries, at your door by tonight.</h1>
  <p class="mt-3 max-w-xl" style="color:var(--mute)">Free delivery on orders over $35. Pick your basket below.</p>
  <div id="cats" class="mt-6 flex gap-2 overflow-x-auto pb-2"></div>
</section>

<main class="max-w-6xl mx-auto px-4 pb-16">
  <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  <p id="empty" class="hidden py-16 text-center" style="color:var(--mute)">No products match. Try a different search or category.</p>
</main>

<div id="overlay" class="hidden fixed inset-0 z-30 bg-black/50"></div>
<aside id="drawer" class="fixed top-0 right-0 z-40 h-full w-full max-w-md translate-x-full transition-transform duration-300 flex flex-col" style="background:var(--card);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)">
  <div class="flex items-center justify-between p-4 border-b" style="border-color:var(--line)">
    <h2 class="text-xl font-extrabold">Your basket</h2>
    <button id="closeCart" class="text-2xl leading-none px-2" aria-label="Close cart">×</button>
  </div>
  <div id="items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
  <div class="p-4 border-t space-y-2" style="border-color:var(--line)">
    <div class="flex justify-between text-sm" style="color:var(--mute)"><span>Delivery</span><span id="ship">$0.00</span></div>
    <div class="flex justify-between text-lg font-extrabold"><span>Total</span><span id="total">$0.00</span></div>
    <button id="checkout" class="w-full rounded-full py-3 font-semibold" style="background:var(--brand);color:var(--brand-ink)">Place order</button>
    <p id="msg" class="text-center text-sm" style="color:var(--brand)"></p>
  </div>
</aside>

<script>
const PRODUCTS=[
{id:1,n:"Red apples",e:"🍎",c:"Fruit",p:3.49,u:"1 kg"},
{id:2,n:"Bananas",e:"🍌",c:"Fruit",p:1.99,u:"1 kg"},
{id:3,n:"Strawberries",e:"🍓",c:"Fruit",p:4.29,u:"250 g"},
{id:4,n:"Carrots",e:"🥕",c:"Vegetables",p:1.79,u:"1 kg"},
{id:5,n:"Broccoli",e:"🥦",c:"Vegetables",p:2.49,u:"each"},
{id:6,n:"Tomatoes",e:"🍅",c:"Vegetables",p:2.99,u:"500 g"},
{id:7,n:"Whole milk",e:"🥛",c:"Dairy",p:1.89,u:"1 L"},
{id:8,n:"Cheddar cheese",e:"🧀",c:"Dairy",p:3.99,u:"200 g"},
{id:9,n:"Free-range eggs",e:"🥚",c:"Dairy",p:3.29,u:"12 pack"},
{id:10,n:"Sourdough loaf",e:"🍞",c:"Bakery",p:3.79,u:"each"},
{id:11,n:"Croissants",e:"🥐",c:"Bakery",p:4.49,u:"4 pack"},
{id:12,n:"Orange juice",e:"🧃",c:"Drinks",p:2.69,u:"1 L"}
];
const CATS=["All",...new Set(PRODUCTS.map(p=>p.c))];
let cat="All",term="",cart={};
try{cart=JSON.parse(localStorage.getItem("gb-cart")||"{}")}catch(e){}
const $=id=>document.getElementById(id), money=n=>"$"+n.toFixed(2);

function save(){try{localStorage.setItem("gb-cart",JSON.stringify(cart))}catch(e){}}

function renderCats(){
  $("cats").innerHTML=CATS.map(c=>`<button data-c="${c}" class="shrink-0 rounded-full px-4 py-1.5 border font-semibold" style="${c===cat?`background:var(--brand);color:var(--brand-ink);border-color:var(--brand)`:`background:var(--card);border-color:var(--line)`}">${c}</button>`).join("");
}
function renderGrid(){
  const list=PRODUCTS.filter(p=>(cat==="All"||p.c===cat)&&p.n.toLowerCase().includes(term));
  $("empty").classList.toggle("hidden",list.length>0);
  $("grid").innerHTML=list.map(p=>`
  <article class="rounded-2xl border p-4 flex flex-col" style="background:var(--card);border-color:var(--line)">
    <div class="text-6xl text-center py-4" aria-hidden="true">${p.e}</div>
    <h3 class="font-semibold">${p.n}</h3>
    <p class="text-sm" style="color:var(--mute)">${p.u}</p>
    <div class="mt-auto pt-3 flex items-center justify-between">
      <span class="text-lg font-extrabold">${money(p.p)}</span>
      <button data-add="${p.id}" class="rounded-full px-3 py-1.5 text-sm font-semibold" style="background:var(--sun);color:#16261a">Add</button>
    </div>
  </article>`).join("");
}
function renderCart(){
  const rows=Object.entries(cart).map(([id,q])=>({p:PRODUCTS.find(x=>x.id==id),q})).filter(r=>r.p);
  const sub=rows.reduce((s,r)=>s+r.p.p*r.q,0), ship=sub===0||sub>=35?0:4.99;
  $("count").textContent=rows.reduce((s,r)=>s+r.q,0);
  $("ship").textContent=ship?money(ship):"Free";
  $("total").textContent=money(sub+ship);
  $("items").innerHTML=rows.length?rows.map(({p,q})=>`
  <div class="flex items-center gap-3">
    <div class="text-3xl">${p.e}</div>
    <div class="flex-1 min-w-0"><div class="font-semibold truncate">${p.n}</div><div class="text-sm" style="color:var(--mute)">${money(p.p)} · ${p.u}</div></div>
    <div class="flex items-center gap-2">
      <button data-dec="${p.id}" class="w-8 h-8 rounded-full border" style="border-color:var(--line)" aria-label="Remove one">−</button>
      <span class="w-5 text-center font-semibold">${q}</span>
      <button data-add="${p.id}" class="w-8 h-8 rounded-full border" style="border-color:var(--line)" aria-label="Add one">+</button>
    </div>
  </div>`).join(""):`<p class="py-10 text-center" style="color:var(--mute)">Your basket is empty. Add something fresh.</p>`;
  save();
}
function toggle(open){
  $("drawer").classList.toggle("translate-x-full",!open);
  $("overlay").classList.toggle("hidden",!open);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.c){cat=t.dataset.c;renderCats();renderGrid()}
  if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;renderCart()}
  if(t.dataset.dec){const id=t.dataset.dec;cart[id]--;if(cart[id]<=0)delete cart[id];renderCart()}
});
$("q").addEventListener("input",e=>{term=e.target.value.trim().toLowerCase();renderGrid()});
$("openCart").onclick=()=>{$("msg").textContent="";toggle(true)};
$("closeCart").onclick=$("overlay").onclick=()=>toggle(false);
$("checkout").onclick=()=>{
  if(!Object.keys(cart).length){$("msg").textContent="Add items before ordering.";return}
  cart={};renderCart();$("msg").textContent="Order placed. Thank you!";
};
renderCats();renderGrid();renderCart();
</script>
</body>
</html>
